name: Wyślij raport KPI i budżetów (Optmyzr)

# Uruchamiany wyłącznie ręcznie. Dane raportu powstają po stronie Claude
# (konektor Optmyzr nie jest dostępny z GitHub Actions) i lądują w repo jako
# plik JSON w katalogu `reports/`; ten workflow odpowiada tylko za wysyłkę
# mailem, korzystając z tych samych sekretów SMTP co pozostałe raporty.

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Ścieżka do pliku JSON z danymi raportu"
        type: string
        default: "reports/latest.json"
      dry_run:
        description: "Tryb testowy: wypisz raport w logach, NIE wysyłaj maila"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wyślij raport
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          REPORT_JSON: ${{ inputs.report }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/send_kpi_report.py
