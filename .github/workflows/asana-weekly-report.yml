name: Cotygodniowy raport czasu z Asany

on:
  schedule:
    # Jeden przebieg w piątek. Cron GitHub Actions działa w UTC, a same
    # harmonogramy bywają uruchamiane z DUŻYM opóźnieniem (nierzadko ~1 h),
    # dlatego NIE opieramy się na dokładnej godzinie – skrypt wysyła raport
    # w każdym zaplanowanym piątkowym przebiegu. 08:00 UTC = 10:00 (czas
    # letni) / 09:00 (czas zimowy) w Polsce; ewentualne opóźnienie GitHuba
    # przesuwa wysyłkę tylko o kilkadziesiąt minut później tego samego ranka.
    - cron: "0 8 * * 5"   # piątek 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tryb testowy: policz i wypisz raport, ale NIE wysyłaj maila"
        type: boolean
        default: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wygeneruj i wyślij raport
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          # Wysyłka e-mail (SMTP):
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Ręczne uruchomienie z checkboxem "dry_run" pomija wysyłkę
          # i pomija kontrolę godziny (FORCE_SEND), żeby dało się testować
          # o dowolnej porze.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/asana_weekly_report.py
